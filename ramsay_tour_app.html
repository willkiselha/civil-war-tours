<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Following Ramsay's Battery — A Civil War Tour</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />
  <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet" />

  <style>
    :root {
      --ink:       #1c1510;
      --parchment: #f2ead8;
      --aged:      #e4d9be;
      --rust:      #8b3a1e;
      --brass:     #9a7c3a;
      --smoke:     #5a5248;
      --border:    #c4b48a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Crimson Pro', Georgia, serif;
      background: var(--parchment);
      color: var(--ink);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── HEADER ── */
    header {
      background: var(--ink);
      color: var(--aged);
      padding: 10px 20px;
      display: flex;
      align-items: baseline;
      gap: 18px;
      border-bottom: 3px solid var(--rust);
      flex-shrink: 0;
    }
    header h1 {
      font-family: 'IM Fell English', Georgia, serif;
      font-size: 1.45rem;
      font-weight: 400;
      letter-spacing: 0.02em;
      color: var(--parchment);
    }
    header span {
      font-size: 0.85rem;
      font-style: italic;
      color: var(--border);
      letter-spacing: 0.04em;
    }

    /* ── BODY LAYOUT ── */
    .layout {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── SIDEBAR ── */
    #sidebar {
      width: 360px;
      flex-shrink: 0;
      background: var(--aged);
      border-right: 2px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #stop-list {
      overflow-y: auto;
      flex-shrink: 0;
      max-height: 38%;
      border-bottom: 2px solid var(--border);
    }

    .stop-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 14px;
      cursor: pointer;
      border-bottom: 1px solid var(--border);
      transition: background 0.15s;
    }
    .stop-item:hover { background: #ddd3b4; }
    .stop-item.active { background: var(--ink); color: var(--parchment); }
    .stop-item.active .stop-num { background: var(--rust); color: var(--parchment); }
    .stop-item.active .stop-name { color: var(--aged); }
    .stop-item.active .stop-date { color: var(--border); }

    .stop-num {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--rust);
      color: var(--parchment);
      font-family: 'IM Fell English', serif;
      font-size: 0.8rem;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .stop-name {
      font-size: 0.9rem;
      font-weight: 600;
      line-height: 1.2;
      flex: 1;
    }
    .stop-date {
      font-size: 0.75rem;
      font-style: italic;
      color: var(--smoke);
      white-space: nowrap;
    }

    /* ── NARRATIVE PANEL ── */
    #narrative-panel {
      flex: 1;
      overflow-y: auto;
      padding: 18px 18px 24px;
    }

    .narrative-stop-num {
      font-family: 'IM Fell English', serif;
      font-size: 2.5rem;
      color: var(--rust);
      opacity: 0.35;
      line-height: 1;
      margin-bottom: 2px;
    }
    .narrative-name {
      font-family: 'IM Fell English', serif;
      font-size: 1.25rem;
      color: var(--ink);
      line-height: 1.25;
      margin-bottom: 2px;
    }
    .narrative-date {
      font-size: 0.82rem;
      font-style: italic;
      color: var(--smoke);
      margin-bottom: 4px;
    }
    .narrative-phase {
      display: inline-block;
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--parchment);
      background: var(--brass);
      padding: 2px 8px;
      border-radius: 2px;
      margin-bottom: 14px;
    }
    .narrative-text {
      font-size: 1rem;
      line-height: 1.75;
      color: #2a2018;
    }

    .placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      text-align: center;
      opacity: 0.5;
      padding: 30px;
    }
    .placeholder .icon { font-size: 2.5rem; margin-bottom: 10px; }
    .placeholder p { font-style: italic; font-size: 0.95rem; line-height: 1.6; }

    /* ── MAP ── */
    #map {
      flex: 1;
      z-index: 0;
    }

    /* ── CUSTOM MARKERS ── */
    .ramsay-marker {
      width: 30px;
      height: 30px;
      border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg);
      border: 2px solid var(--ink);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'IM Fell English', serif;
      font-weight: bold;
      color: #fff;
      font-size: 0.75rem;
      cursor: pointer;
    }
    .ramsay-marker span {
      transform: rotate(45deg);
      display: block;
    }

    /* ── POPUP ── */
    .leaflet-popup-content-wrapper {
      background: var(--ink);
      color: var(--parchment);
      border: 1px solid var(--rust);
      border-radius: 3px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.5);
    }
    .leaflet-popup-tip { background: var(--ink); }
    .leaflet-popup-content {
      font-family: 'Crimson Pro', serif;
      font-size: 0.9rem;
      margin: 10px 14px;
    }
    .popup-title {
      font-family: 'IM Fell English', serif;
      font-size: 1.05rem;
      color: var(--aged);
      margin-bottom: 3px;
    }
    .popup-date {
      font-style: italic;
      color: var(--border);
      font-size: 0.8rem;
      margin-bottom: 6px;
    }
    .popup-btn {
      display: inline-block;
      margin-top: 6px;
      padding: 4px 12px;
      background: var(--rust);
      color: var(--parchment);
      border: none;
      border-radius: 2px;
      font-family: 'Crimson Pro', serif;
      font-size: 0.82rem;
      cursor: pointer;
      letter-spacing: 0.05em;
    }
    .popup-btn:hover { background: #a04422; }

    /* ── SCROLLBAR ── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--aged); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  </style>
</head>

  'Surrender':            '#3a3a3a'
};

// ── STATE ─────────────────────────────────────────────────────────────────
let activeStop = null;
const markers = [];

// ── BUILD STOP LIST ───────────────────────────────────────────────────────
const stopList = document.getElementById('stop-list');
tourData.features.forEach(f => {
  const p = f.properties;
  const item = document.createElement('div');
  item.className = 'stop-item';
  item.dataset.stop = p.stop;
  item.innerHTML = `
    <div class="stop-num">${p.stop}</div>
    <div class="stop-name">${p.name}</div>
    <div class="stop-date">${p.date}</div>
  `;
  item.addEventListener('click', () => selectStop(p.stop));
  stopList.appendChild(item);
});

// ── NARRATIVE RENDER ──────────────────────────────────────────────────────
function renderNarrative(p) {
  document.getElementById('narrative-panel').innerHTML = `
    <div class="narrative-stop-num">${p.stop}</div>
    <div class="narrative-name">${p.name}</div>
    <div class="narrative-date">${p.date}</div>
    <div class="narrative-phase">${p.phase}</div>
    <div class="narrative-text">${p.narrative}</div>
  `;
}

// ── SELECT STOP ───────────────────────────────────────────────────────────
function selectStop(stopNum) {
  activeStop = stopNum;

  // Highlight list item
  document.querySelectorAll('.stop-item').forEach(el => {
    el.classList.toggle('active', parseInt(el.dataset.stop) === stopNum);
  });

  const feature = tourData.features.find(f => f.properties.stop === stopNum);
  renderNarrative(feature.properties);

  // Pan map
  const [lng, lat] = feature.geometry.coordinates;
  map.setView([lat, lng], 10, { animate: true });

  // Open marker popup
  const marker = markers.find(m => m.stopNum === stopNum);
  if (marker) marker.leaflet.openPopup();

  // Scroll list item into view
  const listItem = document.querySelector(`.stop-item[data-stop="${stopNum}"]`);
  if (listItem) listItem.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

// ── ROUTE LINE ────────────────────────────────────────────────────────────
const routeCoords = tourData.features.map(f => [
  f.geometry.coordinates[1],
  f.geometry.coordinates[0]
]);

L.polyline(routeCoords, {
  color: '#8b3a1e',
  weight: 2.5,
  opacity: 0.55,
  dashArray: '6 5'
}).addTo(map);

// ── MARKERS ───────────────────────────────────────────────────────────────
tourData.features.forEach(f => {
  const p = f.properties;
  const [lng, lat] = f.geometry.coordinates;
  const color = phaseColors[p.phase] || '#5a5248';

  const icon = L.divIcon({
    className: '',
    html: `<div class="ramsay-marker" style="background:${color}"><span>${p.stop}</span></div>`,
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -32]
  });

  const marker = L.marker([lat, lng], { icon }).addTo(map);
  marker.bindPopup(`
    <div class="popup-title">${p.name}</div>
    <div class="popup-date">${p.date}</div>
    <div style="font-size:0.78rem;letter-spacing:0.06em;text-transform:uppercase;color:#9a7c3a;margin-bottom:6px;">${p.phase}</div>
    <button class="popup-btn" onclick="selectStop(${p.stop})">Read Narrative →</button>
  `);
  marker.on('click', () => selectStop(p.stop));

  markers.push({ stopNum: p.stop, leaflet: marker });
});
</script>
</body>
</html>
