    narrative_documented:'The Battle of New Bern on March 14, 1862 was Branch\'s first major command — and a humiliating defeat. General Ambrose Burnside landed a large Union force and overwhelmed Branch\'s outnumbered defenders. Branch was outmanned and outgunned, but critics noted significant gaps in his defensive line before the battle even started. One soldier in the 37th North Carolina wrote home that they were "defeated through General Branch\'s bad management." Branch himself acknowledged his inexperience. Jefferson Davis ordered him to take his troops north to consolidate Confederate forces in Virginia. His coastal defense career was over.',

    novel_note:'In The Ground Remains, the Gaines\'s Mill battlefield is the first place both Branch and Ramsay shared the same ground — unknowingly, as strangers. Their connection exists only in the genealogical research of their descendant 160 years later.',

    date_historical:'June 30, 1862',
    category:'battlefield',
    narrative_documented:"Branch's brigade suffered its heaviest losses of the Peninsula Campaign here — 425 casualties. His North Carolinians emerged from the woods and slammed into Joe Hooker's Union troops at the crossroads clearing around Willis Methodist Church. The line surged back and forth in hand-to-hand combat. Hooker's line wavered — then closed up and gave them murderous fire. They were rolled back. General Porter Alexander called Glendale the single point in the entire war where the South might have demoralized the Union into quitting — had it succeeded. It did not. Longstreet had little praise for Branch's performance, reflecting the contempt career officers held for political generals. Branch's brigade suffered 425 casualties. He was learning — at enormous cost.",

    coords:[-77.3050, 37.4150]
  },
  {
    id:'pen_kings_02', phase:4, order:2,
    name:'The James River Ford',
    location:'Henrico County, VA',
    address:'James River, Henrico County, VA',
    date_historical:'July 1–2, 1862',
    category:'crossing',
    narrative_documented:"A.P. Hill ordered Branch to cross the James and reconnoiter the south bank — to assess whether Confederate forces could flank McClellan's position at Harrison's Landing. Branch volunteered because he knew the land: his ancestors had owned it. He selected fifteen men from those who knew the area, including a free Black man named Solomon Batista and a young private named Edward Collins who vouched for him. They crossed at a shallow ford where the current deposited silt at the bottom — a submerged bridge known only to locals. They crossed without incident. What they found on the other side changed everything.",
    narrative_fiction:'The northern banks of the James River were muddy and steep. LOB was covered in wetness and filth as he took the hand of Solomon who assisted him out of the current of the river. The package was protected from the elements tucked within the General\'s document satchel, its strap draped across his left shoulder. Collins was the last to ascend the banks.',
    novel_note:'The river crossing scene is the opening of the chapter "A Reunited Scouting Party" in The Ground Remains. The three men cross back with the package — and nothing is the same afterward.',
    visitor_info:"Stand at the James River and look south. Branch's men waded across here in the summer of 1862, following the remembered geography of land their general's family had owned two centuries before. The river looks today much as it did then.",
    coords:[-77.3350, 37.4450]
  }
];

const phaseColor = '#8B0000';

function makeIcon(stop) {
  const isFinal = stop.category === 'ancestral' || stop.category === 'crossing';
  const size = isFinal ? 30 : 24;
  const html = `
    <div style="
      width:${size}px;height:${size}px;
      background:${phaseColor};
      border-radius:50% 50% 50% 0;
      transform:rotate(-45deg);
      border:2px solid rgba(255,255,255,${isFinal?0.8:0.4});
      display:flex;align-items:center;justify-content:center;
      box-shadow:0 2px 6px rgba(0,0,0,0.5);
    ">
      <span style="transform:rotate(45deg);color:white;font-size:8px;font-weight:bold;font-family:serif;">
        ${stop.order}
      </span>
    </div>`;
  return L.divIcon({ html, className:'', iconSize:[size,size], iconAnchor:[size/2,size] });
}

let markers = [];
let activeStop = null;

function buildMarkers(phaseFilter) {
  markers.forEach(m => map.removeLayer(m.marker));
  markers = [];
  if (window.routeLine) map.removeLayer(window.routeLine);

  const filtered = phaseFilter === 0 ? stops : stops.filter(s => s.phase === phaseFilter);

  filtered.forEach(stop => {
    const m = L.marker([stop.coords[1], stop.coords[0]], { icon: makeIcon(stop) });
    m.addTo(map);
    m.on('click', () => showStop(stop));
    markers.push({ stop, marker: m });
  });

  if (filtered.length > 1) {
    const latlngs = filtered.map(s => [s.coords[1], s.coords[0]]);
    window.routeLine = L.polyline(latlngs, {
      color: '#c8a96e',
      weight: 3,
      opacity: 0.85
    }).addTo(map);
    window.routeLine.bringToFront();
  }
}

function showStop(stop) {
  activeStop = stop.id;
  document.querySelectorAll('.stop-item').forEach(el => {
    el.classList.toggle('active', el.dataset.id === stop.id);
  });
  map.panTo([stop.coords[1], stop.coords[0]]);

  const phaseNum = stop.phase;
  document.getElementById('popup-day').textContent = `${phaseLabels[phaseNum]} · Stop ${stop.order}`;
  document.getElementById('popup-name').textContent = stop.name;
  document.getElementById('popup-location').textContent = stop.location;
  document.getElementById('popup-date').textContent = stop.date_historical;

  let body = '';

  if (stop.narrative_documented) {
    body += `<div class="narrative-section">
      <div class="narrative-label">Historical Record</div>
      <div class="narrative-text">${stop.narrative_documented}</div>
    </div>`;
  }

  if (stop.narrative_fiction) {
    body += `<div class="narrative-section">
      <div class="narrative-label">Narrative</div>
      <div class="narrative-text fiction">${stop.narrative_fiction}</div>
    </div>`;
  }

  if (stop.novel_note) {
    body += `<div class="novel-box">
      <div class="novel-label">✦ The Ground Remains</div>
      <div class="novel-text">${stop.novel_note}</div>
    </div>`;
  }

  if (stop.visitor_info) {
    body += `<div class="visitor-box">
      <div class="visitor-label">▶ Visitor Notes</div>
      <div class="visitor-text">${stop.visitor_info}</div>
    </div>`;
  }

  document.getElementById('popup-body').innerHTML = body;
  document.getElementById('popup-panel').classList.add('visible');
}

function closePopup() {
  document.getElementById('popup-panel').classList.remove('visible');
  activeStop = null;
  document.querySelectorAll('.stop-item').forEach(el => el.classList.remove('active'));
}

function buildSidebar(phaseFilter) {
  const list = document.getElementById('sidebar-list');
  const filtered = phaseFilter === 0 ? stops : stops.filter(s => s.phase === phaseFilter);
  let html = '';
  let currentPhase = null;

  filtered.forEach(stop => {
    if (stop.phase !== currentPhase) {
      currentPhase = stop.phase;
      html += `<div style="padding:6px 14px 4px;font-size:0.6rem;text-transform:uppercase;letter-spacing:0.12em;color:var(--gold);border-top:1px solid var(--border);margin-top:${currentPhase===1?0:4}px;">${phaseLabels[currentPhase]}</div>`;
    }
    html += `
      <div class="stop-item" data-id="${stop.id}" onclick="sidebarClick('${stop.id}')">
        <div class="char-pip"></div>
        <div class="stop-info">
          <div class="stop-name">${stop.name}</div>
          <div class="stop-location">${stop.location}</div>
          <div class="stop-date">${stop.date_historical}</div>
        </div>
      </div>`;
  });

  list.innerHTML = html;
}

function sidebarClick(id) {
  const stop = stops.find(s => s.id === id);
  if (stop) showStop(stop);
}

let currentPhase = 0;
function filterDay(phase, btn) {
  currentPhase = phase;
  document.querySelectorAll('.day-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  buildMarkers(phase);
  buildSidebar(phase);
  closePopup();

  if (phase === 0) {
    map.setView([36.5, -78.0], 7);
  } else {
    const phaseStops = stops.filter(s => s.phase === phase);
    if (phaseStops.length) {
      const lats = phaseStops.map(s => s.coords[1]);
      const lngs = phaseStops.map(s => s.coords[0]);
      map.fitBounds([
        [Math.min(...lats)-0.15, Math.min(...lngs)-0.15],
        [Math.max(...lats)+0.15, Math.max(...lngs)+0.15]
      ]);
    }
  }
}

buildMarkers(0);
buildSidebar(0);
</script>
</body>
</html>
