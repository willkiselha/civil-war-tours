<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Following Branch by Rail & Bicycle</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0e0c08;--surface:#1a1710;--surface2:#221f18;--border:#3a3020;
  --gold:#c8a96e;--gold-dim:#8a6f3e;--text:#e8d9b8;--muted:#9a8a6a;
  --train:#2a6aaa;--bus:#3a7a3a;--bike:#8a5a1a;--tour:#6a3a8a;--lodge:#1a5a5a;--battle:#8B0000;
}
body{font-family:'EB Garamond',Georgia,serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden}

/* HEADER */
header{padding:9px 16px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.h-title{display:flex;flex-direction:column}
.h-eye{font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold-dim);margin-bottom:1px}
.h-main{font-family:'Playfair Display',Georgia,serif;font-size:1.1rem;font-weight:700;color:var(--gold);line-height:1.1}
.h-sub{font-size:.7rem;color:var(--muted);font-style:italic;margin-top:2px}
.legend{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.lpill{display:flex;align-items:center;gap:4px;font-size:.65rem;color:var(--muted);white-space:nowrap}
.ldot{width:8px;height:8px;border-radius:50%;flex-shrink:0}

/* LAYOUT */
.main{display:flex;flex:1;overflow:hidden;position:relative}

/* TIMELINE SIDEBAR */
.sidebar{width:340px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.day-tabs{display:flex;overflow-x:auto;border-bottom:1px solid var(--border);flex-shrink:0;scrollbar-width:none}
.day-tabs::-webkit-scrollbar{display:none}
.dtab{padding:7px 11px;font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);cursor:pointer;white-space:nowrap;border:none;border-bottom:2px solid transparent;background:none;font-family:'EB Garamond',Georgia,serif;transition:color .2s,border-color .2s}
.dtab:hover{color:var(--text)}
.dtab.active{color:var(--gold);border-bottom-color:var(--gold)}

.timeline{flex:1;overflow-y:auto;padding:12px 0 16px;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.timeline::-webkit-scrollbar{width:4px}
.timeline::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

/* TIMELINE EVENTS */
.t-event{display:flex;gap:0;padding:0 14px;position:relative;cursor:pointer}
.t-event:hover .t-card{background:var(--surface2)}
.t-event.active .t-card{background:var(--surface2);border-left-color:var(--gold)}

/* Left column: time + line */
.t-left{width:56px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;padding-top:4px}
.t-time{font-size:.7rem;color:var(--gold-dim);text-align:center;white-space:nowrap;line-height:1.2;min-height:28px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start}
.t-time .arr{font-size:.62rem;color:var(--muted)}
.t-time .dep{font-size:.72rem;font-weight:500;color:var(--gold-dim)}
.t-vline{width:2px;flex:1;min-height:8px}
.t-dot{width:11px;height:11px;border-radius:50%;border:2px solid;flex-shrink:0;z-index:1;background:var(--bg)}

/* Right card */
.t-card{flex:1;margin-left:10px;padding:8px 10px;border-left:2px solid transparent;border-radius:2px;margin-bottom:2px;transition:background .15s,border-color .15s}
.t-label{font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;margin-bottom:2px;font-family:sans-serif}
.t-name{font-family:'Playfair Display',Georgia,serif;font-size:.9rem;color:var(--text);line-height:1.2}
.t-meta{font-size:.68rem;color:var(--muted);margin-top:3px;line-height:1.4}
.t-dur{font-size:.62rem;color:var(--muted);font-style:italic;margin-top:1px}

/* CONNECTOR (between events) */
.t-connector{display:flex;gap:0;padding:0 14px 0;align-items:stretch;height:28px}
.t-conn-left{width:56px;flex-shrink:0;display:flex;justify-content:center}
.t-conn-line{width:2px;flex:1}
.t-conn-right{flex:1;margin-left:10px;display:flex;align-items:center}
.t-conn-label{font-size:.62rem;color:var(--muted);font-style:italic;padding-left:4px}

/* DETAIL PANEL */
.detail{position:absolute;bottom:0;left:340px;right:0;max-height:45%;background:var(--surface);border-top:1px solid var(--border);overflow-y:auto;padding:14px 18px 18px;z-index:500;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.detail::-webkit-scrollbar{width:4px}
.detail::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.detail.hidden{display:none}
.d-close{float:right;background:none;border:none;color:var(--muted);font-size:1.1rem;cursor:pointer;margin-left:8px;line-height:1}
.d-close:hover{color:var(--text)}
.d-eye{font-size:.65rem;letter-spacing:.15em;text-transform:uppercase;color:var(--gold-dim);margin-bottom:3px}
.d-title{font-family:'Playfair Display',Georgia,serif;font-size:1.15rem;font-weight:700;color:var(--gold);margin-bottom:5px;line-height:1.2}
.d-timing{display:flex;gap:16px;margin-bottom:8px;flex-wrap:wrap}
.d-chip{font-size:.72rem;padding:3px 10px;border-radius:20px;border:1px solid;display:inline-flex;align-items:center;gap:5px}
.d-body{font-size:.88rem;line-height:1.65;color:var(--text);margin-bottom:8px}
.d-box{background:var(--surface2);border:1px solid var(--border);border-radius:3px;padding:9px 12px;margin-top:6px}
.d-box-title{font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-dim);margin-bottom:5px}
.d-row{display:flex;gap:7px;align-items:flex-start;margin-bottom:4px;font-size:.8rem;line-height:1.4;color:var(--muted)}
.d-icon{flex-shrink:0}
.d-warn{margin-top:7px;padding:5px 9px;border-left:3px solid #8a6400;font-size:.78rem;color:#c8a030;background:rgba(138,100,0,.1)}
.d-bike{margin-top:7px;padding:5px 9px;border-left:3px solid var(--bike);font-size:.78rem;color:var(--muted);font-style:italic;background:rgba(138,90,26,.08)}

/* MAP */
#map{flex:1;background:#0a0906}

/* MAP LEGEND */
.mleg{position:absolute;bottom:10px;right:10px;background:rgba(26,23,16,.93);border:1px solid var(--border);border-radius:3px;padding:7px 11px;z-index:400;font-size:.67rem;color:var(--muted)}
.mleg-title{font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-dim);margin-bottom:4px}
.mleg-row{display:flex;align-items:center;gap:6px;margin-bottom:2px}
.mleg-line{width:20px;height:3px;border-radius:2px;flex-shrink:0}
.mleg-dash{width:20px;height:0;border-top:3px dashed;flex-shrink:0;opacity:.75}

/* Leaflet overrides */
.leaflet-popup-content-wrapper{background:var(--surface);border:1px solid var(--border);border-radius:3px;box-shadow:0 4px 18px rgba(0,0,0,.6);color:var(--text);font-family:'EB Garamond',Georgia,serif}
.leaflet-popup-tip{background:var(--surface)}
.pop-title{font-family:'Playfair Display',Georgia,serif;font-size:.92rem;font-weight:700;color:var(--gold);margin-bottom:3px}
.pop-meta{font-size:.72rem;color:var(--muted)}
.pop-time{font-size:.72rem;color:var(--gold-dim);margin-top:2px}

@media(max-width:640px){
  .sidebar{width:100%;position:absolute;z-index:600;height:42%;bottom:0;border-right:none;border-top:1px solid var(--border)}
  #map{height:58%}
  .detail{left:0}
  .legend{display:none}
}
</style>
</head>
<body>
<header>
  <div class="h-title">
    <div class="h-eye">Civil War Transit Tour</div>
    <div class="h-main">Following Branch by Rail &amp; Bicycle</div>
    <div class="h-sub">Washington D.C. → Antietam · 7 Days · Amtrak · VRE · MARC · Virginia Breeze · Bicycle</div>
  </div>
  <div class="legend">
    <div class="lpill"><div class="ldot" style="background:var(--train)"></div>Train</div>
    <div class="lpill"><div class="ldot" style="background:var(--bus)"></div>Bus</div>
    <div class="lpill"><div class="ldot" style="background:var(--bike)"></div>Bicycle</div>
    <div class="lpill"><div class="ldot" style="background:var(--tour)"></div>Arranged</div>
    <div class="lpill"><div class="ldot" style="background:var(--lodge)"></div>Lodging</div>
    <div class="lpill"><div class="ldot" style="background:var(--battle)"></div>Battlefield</div>
  </div>
</header>

<div class="main">
  <div class="sidebar">
    <div class="day-tabs" id="dayTabs"></div>
    <div class="timeline" id="timeline"></div>
  </div>
  <div id="map"></div>
  <div class="mleg">
    <div class="mleg-title">Route</div>
    <div class="mleg-row"><div class="mleg-line" style="background:var(--train)"></div>Train</div>
    <div class="mleg-row"><div class="mleg-line" style="background:var(--bus)"></div>Bus</div>
    <div class="mleg-row"><div class="mleg-line" style="background:var(--bike)"></div>Bicycle</div>
    <div class="mleg-row"><div class="mleg-dash" style="border-color:var(--tour)"></div>Arranged</div>
  </div>
  <div class="detail hidden" id="detail"></div>
</div>

<script>
const C = {train:'#2a6aaa',bus:'#3a7a3a',bike:'#8a5a1a',tour:'#6a3a8a',lodge:'#1a5a5a',battle:'#8B0000'};
const E = {train:'🚂',bus:'🚌',bike:'🚲',tour:'🚗',lodge:'🏨',battle:'⚔️'};

// ─── FULL ITINERARY DATA ───────────────────────────────────────────────────────
// Each event: id, name, mode, arrive, depart, duration, coords, eyebrow, body, logistics[], bikeNote, warn
const DAYS = [
{id:1, label:'Day 1', title:'Washington D.C.', events:[
  {id:'dc-arrive', name:'Washington D.C. — Arrival at Union Station', mode:'lodge',
   arrive:null, depart:null, duration:null,
   coords:[38.8974,-77.0066],
   eyebrow:'Day 1 · Arrival',
   body:'Union Station is your base and your gateway — the same rail hub that funneled Union troops and materiel south throughout the Civil War. Arrive by afternoon, check in nearby, and orient yourself for the week ahead. LOB Branch served as a U.S. Congressman from this city before resigning to join the Confederacy in 1861.',
   logistics:[
     {icon:'🏨',text:'Recommended lodging: Hotel Zena (1155 14th St NW), Kimpton George Hotel (15 E St NW), or Hyatt Place Capitol Hill — all within easy walk of Union Station.'},
     {icon:'🚲',text:'Bikes: store at hotel overnight. Amtrak accepts full-size bikes as checked baggage ($20/bike, requires bike bag) or in coach on Northeast Regional. Confirm bike reservation at booking.'},
     {icon:'🗺️',text:'Afternoon: National Mall, National Portrait Gallery (Branch portrait in Civil War collection), or the Capitol building Branch once served.'}
   ],
   bikeNote:'Capital Crescent Trail and Rock Creek Park paths offer excellent city cycling from Union Station area.',
   warn:null},
]},

{id:2, label:'Day 2', title:'Ashland, VA', events:[
  {id:'dc-ashland-train', name:'Union Station → Ashland, VA', mode:'train',
   arrive:null, depart:'9:27am', duration:'~1h 55m · arr. 11:02am',
   coords:[37.7596,-77.4812],
   eyebrow:'Day 2 · Morning · Amtrak Northeast Regional #95',
   body:'Board the southbound Northeast Regional at Union Station. Train 95 (Mon–Fri) departs at 9:27am and arrives Ashland at 11:02am — just under two hours through Alexandria, Fredericksburg, and Quantico. The RF&P rail corridor you travel is the same line Branch\'s troops moved along in 1862. Ashland\'s 1923 station sits on Center Street, where trains still run down the center of town past shade trees and antebellum homes.',
   logistics:[
     {icon:'🚂',text:'Train: Amtrak NE Regional #95. Departs Union Station 9:27am (Mon–Fri). Arrives Ashland (ASD) 11:02am. Weekend alt: Train #195 departs 9:27am Sat/Sun arriving 11:12am.'},
     {icon:'💰',text:'Tickets from ~$13. Book at amtrak.com — select Washington DC (WAS) → Ashland (ASD).'},
     {icon:'🚲',text:'Bikes: bring in a bike bag in the coach car. Reserve bike space at booking. Folding bikes travel as carry-on with no reservation.'},
     {icon:'🏨',text:'Check in: Henry Clay Inn, 114 N Railroad Ave — directly across from the Amtrak platform. Historic 1901 inn.'}
   ],
   bikeNote:null, warn:'Train #95 is Mon–Fri only. Weekends use Train #195 (same departure time). Confirm at amtrak.com when booking.'},

  {id:'ashland-explore', name:'Afternoon: Hanover Court House & Seven Days Area', mode:'bike',
   arrive:'~11:15am', depart:null, duration:'Afternoon',
   coords:[37.7447,-77.3464],
   eyebrow:'Day 2 · Afternoon · Bicycle or arranged transport',
   body:'Hanover Court House (May 27, 1862) was Branch\'s first real battlefield command — and a painful early lesson. Surprised by Fitz John Porter\'s Union force, Branch\'s brigade was routed. The historic courthouse building is a National Historic Landmark, the same courthouse where Patrick Henry argued the Parson\'s Cause. Ride 11 miles by bike via Old Telegraph Road, or arrange a car tour for the Seven Days battle sites (Beaver Dam Creek, Gaines\' Mill) further south.',
   logistics:[
     {icon:'🚲',text:'~11 miles Ashland → Hanover Courthouse via Old Telegraph/Courthouse Rd. Mostly flat, allow 50–60 min each way. Return before dark.'},
     {icon:'🚗',text:'For Seven Days sites (Beaver Dam Creek, Gaines\' Mill, Cold Harbor): arrange a half-day driving tour. Cold Harbor Visitor Center: 5515 Anderson-Wright Dr, Mechanicsville.'},
     {icon:'📍',text:'Hanover Courthouse: 7507 Library Drive, Hanover VA 23069.'}
   ],
   bikeNote:'Return ride to Ashland via Studley Road — rolling terrain, very pleasant in late afternoon.',
   warn:null},
]},

{id:3, label:'Day 3', title:'Richmond, VA', events:[
  {id:'ashland-richmond-train', name:'Ashland → Richmond Main Street Station', mode:'train',
   arrive:null, depart:'~11:12am or ~4:21pm', duration:'~25 min',
   coords:[37.5333,-77.4284],
   eyebrow:'Day 3 · Morning · Amtrak Northeast Regional',
   body:'A short hop south on the same Northeast Regional line. Take the mid-morning train from Ashland (dep. ~11:02am arr. Richmond ~11:40am) or the afternoon train (dep. Ashland ~4:21pm) depending on how you pace Day 2. Richmond Main Street Station is a stunning 1901 Beaux-Arts terminal, now beautifully restored. The Jefferson Hotel — your lodging — has been open since 1895 and is a National Historic Landmark.',
   logistics:[
     {icon:'🚂',text:'Amtrak NE Regional: Ashland (ASD) → Richmond Main Street (RVM). ~25 min. Morning train departs Ashland ~11:02am, arrives Richmond ~11:40am. Afternoon train departs ~4:21pm.'},
     {icon:'🏨',text:'Check in: The Jefferson Hotel, 101 W Franklin St, Richmond VA 23220. Book well in advance — one of the South\'s finest historic hotels.'},
     {icon:'🚲',text:'Richmond has excellent bike infrastructure. The Canal Walk bikeway links Main Street Station to Tredegar and beyond.'}
   ],
   bikeNote:null, warn:null},

  {id:'tredegar', name:'American Civil War Museum — Tredegar Iron Works', mode:'bike',
   arrive:'~1pm', depart:null, duration:'2–3 hours',
   coords:[37.5381,-77.4525],
   eyebrow:'Day 3 · Afternoon · ~1 mile from Jefferson Hotel by bike',
   body:'The Tredegar Iron Works manufactured most of the Confederacy\'s artillery — the guns Branch\'s men depended on throughout the Peninsula Campaign. The museum holds the most comprehensive collection of Civil War artifacts in existence and tells the war from multiple perspectives. The 1865 photographic archive is extraordinary, and the outdoor ruins of the original ironworks complex extend along the James River.',
   logistics:[
     {icon:'📍',text:'480 Tredegar St, Richmond VA 23219. On the James River at the original ironworks site.'},
     {icon:'🚲',text:'~1 mile from The Jefferson via the Canal Walk bikeway — flat, scenic, following the Kanawha Canal alongside the James River.'},
     {icon:'🕐',text:'Allow 2–3 hours minimum. Open daily.'}
   ],
   bikeNote:'James River Heritage Trail extends east and west from Tredegar — excellent evening ride.',
   warn:null},

  {id:'richmond-sites', name:'Hollywood Cemetery & Richmond Civil War Sites', mode:'bike',
   arrive:'~4pm', depart:null, duration:'Afternoon/Evening',
   coords:[37.5540,-77.4593],
   eyebrow:'Day 3 · Late Afternoon',
   body:'Hollywood Cemetery holds 18,000 Confederate soldiers — the largest Confederate burial ground in the country — plus Jefferson Davis and J.E.B. Stuart. The Confederate Capitol building stands a short ride away — the seat of the government Branch took up arms to defend after resigning his U.S. Congressional seat in Washington in 1861.',
   logistics:[
     {icon:'📍',text:'Hollywood Cemetery: 412 S Cherry St, Richmond. Open daily 8am–5pm. ~1.5 miles from The Jefferson.'},
     {icon:'🏛️',text:'Virginia State Capitol (former Confederate Capitol): 1000 Bank St, Richmond.'}
   ],
   bikeNote:null, warn:null},
]},

{id:4, label:'Day 4', title:'Orange, VA', events:[
  {id:'richmond-charlottesville-bus', name:'Richmond → Charlottesville via Virginia Breeze', mode:'bus',
   arrive:null, depart:'Check virginiabreeze.org', duration:'~1h 30m',
   coords:[38.0293,-78.4767],
   eyebrow:'Day 4 · Morning · Virginia Breeze Bus',
   body:'The Virginia Breeze intercity bus connects Richmond Main Street Station west to Charlottesville along I-64, serving as your first transit hop toward Orange County. The Breeze is a state-supported motorcoach with Wi-Fi and power outlets. Charlottesville is your transfer point for the Amtrak train north to Culpeper. Coordinate your Richmond departure to allow a comfortable connection.',
   logistics:[
     {icon:'🚌',text:'Virginia Breeze: Book at virginiabreeze.org. Departs Richmond Main Street Station area. ~1.5 hr to Charlottesville. Check current schedule online — multiple daily departures.'},
     {icon:'🚲',text:'Bikes on Virginia Breeze must be boxed or bagged and count as luggage. Space is limited — confirm with operator when booking.'},
     {icon:'⏱️',text:'Aim for a morning departure from Richmond to allow time to catch the afternoon Amtrak to Culpeper.'}
   ],
   bikeNote:null, warn:'Confirm current Virginia Breeze times at virginiabreeze.org before booking — seasonal schedules vary.'},

  {id:'charlottesville-culpeper-train', name:'Charlottesville → Culpeper', mode:'train',
   arrive:null, depart:'Check amtrak.com', duration:'~45 min',
   coords:[38.4722,-77.9933],
   eyebrow:'Day 4 · Midday · Amtrak Northeast Regional or Cardinal',
   body:'From Charlottesville, board Amtrak north to Culpeper Station — one of Virginia\'s finest small-town depots, built in 1904 on the original Orange & Alexandria Railroad. This is the very rail line the Union and Confederate armies fought over repeatedly in 1862–1863. Branch\'s brigade and Ramsay\'s battery both used this corridor. The station is your gateway to Orange County.',
   logistics:[
     {icon:'🚂',text:'NE Regional serves Culpeper 2x daily. Cardinal serves Culpeper Mon/Wed/Sat northbound, Tue/Thu/Sun southbound. Book at amtrak.com — Charlottesville (CVS) → Culpeper (CLP).'},
     {icon:'📍',text:'Culpeper Station: 109 South Commerce Street, Culpeper VA.'},
     {icon:'🚲',text:'Checked baggage service at Culpeper for bikes on most trains — confirm at booking.'}
   ],
   bikeNote:null, warn:'The Cardinal runs only 3x/week. Northeast Regional offers daily flexibility. A Wednesday departure from Richmond → Charlottesville → Culpeper works perfectly with weekday TOOT connector service.'},

  {id:'culpeper-orange-transit', name:'Culpeper → Orange via TOOT Connector · Inn at Willow Grove', mode:'bus',
   arrive:'arrange pickup', depart:'TOOT departs Culpeper ~8:15am / hourly to 4:15pm', duration:'~45 min to Orange',
   coords:[38.2458,-78.1130],
   eyebrow:'Day 4 · Afternoon · TOOT Orange/Culpeper Connector + Inn Pickup · WEEKDAYS ONLY',
   body:'The TOOT (Town of Orange Transit) Orange/Culpeper Connector runs hourly on weekdays between Culpeper Station and the Town of Orange. The Inn at Willow Grove sits 4 miles south of town on Route 15 — call ahead and the inn\'s concierge will arrange pickup from the nearest bus stop, or directly from Culpeper Station. The inn\'s full-service concierge is noted for handling exactly this kind of arrangement. Willow Grove itself is a Forbes Four-Star 18th-century estate where Civil War trenches and a cannonball were found during its restoration.',
   logistics:[
     {icon:'🚌',text:'TOOT Orange/Culpeper Connector: Weekdays only. Hourly departures from Culpeper ~8:15am, 9:15am, 10:15am... through 4:15pm. Fare ~$0.50 each way. Phone: (540) 672-8668.'},
     {icon:'📞',text:'Inn at Willow Grove: (540) 317-1206. Request pickup from Orange Town stop or Culpeper Station. Call 24+ hours ahead.'},
     {icon:'🏨',text:'Inn at Willow Grove: 14079 Plantation Way, Orange VA 22960. Forbes Four-Star. French-pressed coffee and beignets at your door each morning. Full spa on property.'}
   ],
   bikeNote:'If cycling from Orange Town to the inn: 4 miles south on Route 15 — manageable on a road shoulder with moderate traffic.',
   warn:'⚠️ WEEKDAYS ONLY — TOOT operates Mon–Fri only. This is a hard constraint. Plan your Richmond departure on a Tuesday or Wednesday to arrive at Culpeper on Wednesday, giving you a full day in Orange before the Thursday return to catch the train to Manassas.'},

  {id:'gordonsville-cedar-mountain', name:'Gordonsville & Cedar Mountain Battlefield', mode:'tour',
   arrive:'~4pm', depart:null, duration:'Remaining afternoon',
   coords:[38.1381,-78.1840],
   eyebrow:'Day 4 · Late Afternoon · Arranged driving tour',
   body:'Gordonsville was a critical Confederate rail junction — where the Virginia Central and Orange & Alexandria Railroads crossed — and a key staging ground before Second Manassas. Cedar Mountain (August 9, 1862) was where Stonewall Jackson\'s corps, including Branch, clashed with Pope\'s Army of Virginia in a fierce preliminary engagement. Arrange a local guide through the inn\'s concierge for the late afternoon.',
   logistics:[
     {icon:'🚗',text:'Arrange through the inn concierge: half-day driving tour, Gordonsville → Cedar Mountain. Both sites within 20 miles of the inn.'},
     {icon:'🏛️',text:'Gordonsville Exchange Hotel Civil War Museum: 400 N Main St, Gordonsville — a Confederate hospital, now a museum.'},
     {icon:'📍',text:'Cedar Mountain Battlefield: 9465 General Winder Rd, Rapidan VA 22733.'}
   ],
   bikeNote:null, warn:null},
]},

{id:5, label:'Day 5', title:'Manassas, VA', events:[
  {id:'orange-culpeper-return', name:'Orange → Culpeper Station', mode:'bus',
   arrive:null, depart:'TOOT departs Orange ~7:15am or 8:15am', duration:'~45 min · WEEKDAYS ONLY',
   coords:[38.4722,-77.9933],
   eyebrow:'Day 5 · Early Morning · TOOT Connector + Amtrak · WEEKDAYS ONLY',
   body:'Rise early for coffee and beignets, then arrange a 7am inn pickup to the Orange TOOT stop. The connector returns you to Culpeper Station in time for a mid-morning Amtrak north to Manassas. The first TOOT departure from Orange is ~7:15am, arriving Culpeper ~8:00am — giving you time to catch the mid-morning train.',
   logistics:[
     {icon:'🚌',text:'TOOT Orange/Culpeper Connector: First departure Orange ~7:15am, arrives Culpeper ~8:00am. Reservations recommended: (540) 341-3464. 24–48 hour notice required.'},
     {icon:'📞',text:'Alternative: Inn concierge can arrange a car directly to Culpeper Station if TOOT timing doesn\'t align.'},
   ],
   bikeNote:null, warn:'⚠️ WEEKDAYS ONLY. Must be Thursday to use TOOT. If your Day 4 arrival was Wednesday, Day 5 is Thursday — you\'re on schedule.'},

  {id:'culpeper-manassas-train', name:'Day 5 Option A — Culpeper → Manassas by Train', mode:'train',

  {id:'jackson-flank-march-bike', name:"Day 5 Option B — Jackson's Flank March by E-Bike", mode:'bike',
   arrive:null, depart:'~7:00am from Culpeper Station', duration:'~55 miles · 5–7 hours · E-BIKE STRONGLY RECOMMENDED',
   coords:[38.5080,-77.8960],
   eyebrow:"Day 5 · Full Day · E-Bike · Culpeper → Brandy Station → Waterloo Bridge → Marshall → Thoroughfare Gap → Manassas · OPTION B",
   body:"Option B — the most ambitious and historically immersive ride of the entire tour. On August 25–26, 1862, Jackson's corps — Branch's brigade marching in column — swept 55 miles from Jeffersonton northwest of Culpeper, through Thoroughfare Gap in the Bull Run Mountains, to strike the Orange & Alexandria Railroad at Bristoe Station and Manassas Junction. This route approximates that march on quiet Virginia back roads and one extraordinary historic bridge. Depart Culpeper Station by 7am, ride north to Brandy Station, then northwest through Jeffersonton, cross the Rappahannock at the Waterloo Bridge on Route 613, continue north through Hume and Marshall, push through Thoroughfare Gap on Route 55, and arrive at Manassas — where Jackson's men arrived on August 26 to burn the Union supply depot. You have ridden this route. On a regular bike it is a genuine challenge. On an e-bike, it becomes one of the great Civil War rides in Virginia.",
   logistics:[
     {icon:'🚲',text:"Leg 1 — Culpeper to Brandy Station (~8 miles): north on Beverly Ford Road / US 15 Alt. Brandy Station saw the largest cavalry battle ever fought on American soil (June 9, 1863). Fleetwood Hill markers are worth 20 minutes."},
     {icon:'🚲',text:"Leg 2 — Brandy Station to Waterloo Bridge (~15 miles): northwest via Alanthus Road and Route 229 (Rixeyville Road) through Jeffersonton to Route 613. Rolling Piedmont farmland, horse country, very light traffic — Jackson's terrain in the August heat."},
     {icon:'🌉',text:"Waterloo Bridge (Route 613 / Rappahannock River): the Rappahannock crossing used on Jackson's flanking march. The 1878 iron Pratt through-truss bridge sits on Civil War-era stone piers. Restored and reopened February 2021 after a $3.65M rehabilitation — now the oldest metal truss bridge in service in Virginia. A Virginia DHR historical marker at the bridge explicitly references Jackson's 'Ride Around Pope.' Cross it slowly."},
     {icon:'🚲',text:'Leg 3 — Waterloo to Marshall (~12 miles): north on Route 688 / Leeds Manor Road through Hume. Rolling Fauquier County horse country with real climbing. Marshall (formerly Salem) was a key waypoint on the original march.'},
     {icon:'🚲',text:"Leg 4 — Marshall to Thoroughfare Gap (~8 miles): east on Route 55 (John Marshall Highway). The gap cuts through the Bull Run Mountains at 423 ft. On August 28, 1862, Longstreet held this gap open while Jackson engaged Pope. The ruins of Beverley Mill stand at the eastern mouth. Route 55 carries moderate truck traffic — use the shoulder through the gap."},
     {icon:'🚲',text:"Leg 5 — Thoroughfare Gap to Manassas (~12 miles): east on Route 55 through Gainesville. Terrain flattens as you descend. You arrive at Manassas exactly as Jackson's men did — from the west, through the gap, onto the plains where the battle would be fought."},
     {icon:'⚡',text:'E-bike strongly recommended. Total elevation gain ~2,800 ft, concentrated in the hills between Waterloo and Marshall. Folding e-bike covers the route in 5–6 hours with stops. Regular bike is doable but plan 7–8 hours and carry extra food and water.'},
     {icon:'🏨',text:'Arrive Manassas: Manassas Junction B&B (9311 Prescott Ave). Call ahead to arrange late arrival: (703) 216-7803.'},
     {icon:'💧',text:'Water/resupply: Culpeper (start), Brandy Station (limited), Jeffersonton (small store), Marshall (gas station/deli), Gainesville (full services). Carry at least 2 liters and top up at every stop.'}
   ],
   bikeNote:"Jackson's corps covered this ground in two days carrying muskets and three days' rations in August heat. You have an e-bike and a Camelbak. The Waterloo Bridge alone justifies the detour.",
   warn:'⚠️ Full-day commitment — 55 miles with ~2,800 ft of climbing. Depart no later than 7am. Route 55 through Thoroughfare Gap carries truck traffic — use the shoulder carefully. Check weather before departing.'},

  {id:'second-manassas', name:'Second Manassas National Battlefield', mode:'battle',
   arrive:'~11am (Option A) or late afternoon (Option B)', depart:null, duration:'3–4 hours',
   coords:[38.8133,-77.5244],
   eyebrow:'Day 5 · Midday–Afternoon · Arranged driving tour from Manassas',
   body:'Second Manassas (August 28–31, 1862) was Branch\'s finest hour. His North Carolina brigade held the left of Jackson\'s line along an unfinished railroad cut, repelling repeated Union assaults before Longstreet\'s massive flank attack crushed Pope\'s army. This was the engagement that cemented Branch\'s reputation. The battlefield is vast — a vehicle is essential. The Visitor Center\'s film and exhibits are excellent context before driving the ground.',
   logistics:[
     {icon:'🏛️',text:'Manassas National Battlefield Park: 6511 Sudley Rd, Manassas VA 20109. Visitor Center open daily.'},
     {icon:'🚗',text:'Rent a car from Enterprise or Hertz in Manassas for the afternoon, or arrange a licensed guide from the hotel.'},
     {icon:'🚲',text:'Henry Hill Loop Trail (~1 mile) is bikeable — good supplement to a driving tour for the core of the field.'}
   ],
   bikeNote:'The unfinished railroad cut where Branch held his line can be reached on foot from the Deep Cut parking area.',
   warn:null},

  {id:'bristow-museum', name:'Bristoe Station Battlefield & Manassas Museum', mode:'tour',
   arrive:'~3pm', depart:null, duration:'1–2 hours',
   coords:[38.7240,-77.5430],
   eyebrow:'Day 5 · Afternoon',
   body:'Bristoe Station carries two distinct Civil War moments, both essential to understanding what happened at Second Manassas. On the evening of August 26, 1862, Jackson\'s corps — including Branch\'s brigade — completed a remarkable 55-mile flanking march through Thoroughfare Gap and struck the Orange & Alexandria Railroad here, wrecking two trains and tearing up track. Jackson then detached a brigade to seize the massive Union supply depot at Manassas Junction overnight, forcing Pope to abandon his Rappahannock defensive line entirely and setting the stage for the main battle two days later. Branch\'s men were in the thick of this march — it was one of the most audacious movements of the entire war. A second, separate engagement here on October 14, 1863 saw Confederate forces ambush Union pursuers on the same ground. The Manassas Museum in Old Town tells the full regional story.',
   logistics:[
     {icon:'🏛️',text:'Bristoe Station Battlefield Heritage Park: 10501 Tenth Alabama Way, Bristow VA 20136. Phone: (703) 366-3049. Managed by Prince William County. The park preserves both the August 1862 and October 1863 battle grounds.'},
     {icon:'🏛️',text:'Manassas Museum: 9101 Prince William St, Manassas VA. Covers the full regional Civil War story including the railroad operations that made this corridor so strategically vital.'},
     {icon:'🚗',text:'Bristoe Station is ~7 miles from Manassas Station — include it in your arranged driving tour with Second Manassas rather than as a separate afternoon trip.'}
   ],
   bikeNote:null, warn:null},
]},

  {id:'wod-whites-ford', name:'Route Option B1 — W&OD Trail + White\'s Ford Wade + C&O Towpath', mode:'bike',
   arrive:null, depart:'~6:30am from Manassas or Chantilly', duration:'~30–35 miles · 3–4 hours · includes Potomac wade',
   coords:[39.1147,-77.5430],
   eyebrow:'Day 6 · Morning · Bicycle · W&OD → White\'s Ford → C&O Towpath → Point of Rocks · OPTION B1 · Adventure Route',
   body:'Option B1 — the most historically resonant route on the entire tour. Depart Manassas or Chantilly early and ride the W&OD Trail west to Leesburg, then follow Battlefield Parkway north ~4 miles to White\'s Ford Regional Park on the Virginia shore of the Potomac. This is the exact crossing point where Lee\'s Army of Northern Virginia — Branch\'s brigade among them — waded into Maryland in September 1862 to begin the campaign that ended at Antietam. The ford sits at approximately Lock 26 on the C&O Canal (mile 39). Wade the Potomac, cross onto the Maryland bank, and pick up the C&O Canal Towpath heading northwest ~9 miles to Point of Rocks station, where the MARC Brunswick Line carries you the remaining 13 miles to Harpers Ferry. You will have crossed the same river, at the same spot, as the men you are tracing.',
   logistics:[
     {icon:'🚲',text:'W&OD to Leesburg: join the W&OD at Chantilly (mile ~24) for a ~17-mile ride west to Leesburg. Paved asphalt, generally flat with gradual elevation gain. From Leesburg, follow Battlefield Parkway / Rt 654 north ~4 miles to White\'s Ford Regional Park (43646 Hibler Rd, Leesburg VA 20176). NOVA Parks property — free public access.'},
     {icon:'🌊',text:'White\'s Ford crossing: the ford sits at C&O Canal Lock 26, mile 39. The Potomac is wide and historically shallow here — armies used it precisely because it was fordable. In summer/fall low-water conditions expect knee-to-thigh depth. Remove shoes, secure gear in dry bags, and walk bikes across. Check USGS Potomac gauge at Point of Rocks (station 01638500) the evening before — safe fording typically under 4.0 ft. waterdata.usgs.gov.'},
     {icon:'🗺️',text:'C&O Towpath to Point of Rocks: once across, join the C&O Canal Towpath heading northwest. Point of Rocks station is ~9 miles up the towpath (mile 48.2). Note: the towpath in the mile or two approaching Point of Rocks can be muddy after rain — plan accordingly.'},
     {icon:'🚂',text:'Point of Rocks MARC Station: 4000 Clay Street, Point of Rocks MD. A stunning 1875 Gothic B&O Railroad station. Board the westbound Brunswick Line to Harpers Ferry (~25 min). Full-size bikes and e-bikes permitted on all Brunswick Line trains. Check mta.maryland.gov/marc-brunswick for westbound departure times.'},
     {icon:'⚡',text:'E-bike note: a folding e-bike is ideal for the W&OD leg. For the ford itself, lift the bike and carry or wheel it through — motor and battery should be kept clear of submersion. Most folding e-bikes have splash-resistant components but check your model\'s water rating before attempting.'},
     {icon:'🏛️',text:'White\'s Ford Regional Park has interpretive signs describing Lee\'s 1862 crossing. Allow 15–20 minutes here to read the markers and take in the ground before wading.'}
   ],
   bikeNote:'Branch\'s brigade crossed here on September 4–6, 1862 — singing "Maryland, My Maryland" as they waded in. You are following their exact line of march into enemy territory.',
   warn:'⚠️ The ford crossing requires advance planning. Check the USGS gauge at Point of Rocks (station 01638500) at waterdata.usgs.gov the evening before — do not attempt above 4.0 ft. Bring water shoes, dry bags for electronics and gear, and a change of socks. This is an adventure route.'},

  {id:'wod-point-of-rocks', name:'Route Option B2 — W&OD Trail + Point of Rocks Bridge (Dry Crossing)', mode:'bike',
   arrive:null, depart:'~6:30am from Manassas or Chantilly', duration:'~35–40 miles · 3–4 hours · no ford required',
   coords:[39.2735,-77.5333],
   eyebrow:'Day 6 · Morning · Bicycle · W&OD → Purcellville → Point of Rocks Bridge · OPTION B2 · Dry Route',
   body:'Option B2 — the full W&OD route to Point of Rocks via bridge, no ford required. Ride the W&OD Trail all the way to its western terminus at Purcellville, then follow quiet rural Loudoun County roads north ~9 miles through Lovettsville to the US Route 15 bridge at Point of Rocks — crossing the Potomac into Maryland on the bridge and arriving directly at the MARC station. This route covers the full 45-mile W&OD, itself historically significant as the former Washington & Old Dominion Railroad right-of-way that both armies fought to control in 1861–62. The Lovettsville corridor north of Purcellville was active cavalry country throughout the war. Point of Rocks station, a gorgeous 1875 Gothic B&O Railroad building, is the reward at the end.',
   logistics:[
     {icon:'🚲',text:'W&OD Trail full western run: join at Chantilly (mile ~24) or Manassas via connector. Ride to Purcellville terminus (~21 miles from Chantilly). Paved asphalt throughout, ~470 ft gradual elevation gain westward — very manageable on an e-bike.'},
     {icon:'🗺️',text:'Purcellville to Point of Rocks: ~9 miles north via Hirst Rd → Morrisonville Rd → Lovettsville Rd → Point of Rocks Rd (MD 464). Quiet rural roads through Lovettsville, VA, then across the US 15 bridge over the Potomac into Maryland. The Lovettsville area saw repeated cavalry action in 1862–63.'},
     {icon:'🚂',text:'Point of Rocks MARC Station: 4000 Clay Street, Point of Rocks MD. Board the westbound Brunswick Line to Harpers Ferry (~25 min). Full-size bikes and e-bikes permitted. Check mta.maryland.gov/marc-brunswick for westbound afternoon departure times.'},
     {icon:'⏱️',text:'Total: ~35–40 miles over 3–4 hours. Depart by 6:30–7am to reach Point of Rocks by mid-morning with time to explore the station and catch an afternoon MARC to Harpers Ferry.'},
     {icon:'⚡',text:'E-bike advantage: the gradual westward elevation gain on the W&OD is the main physical challenge of this route. An e-bike makes it a comfortable morning ride rather than an endurance effort.'},
     {icon:'⛴️',text:'Note: White\'s Ferry (the former vehicle ferry near Leesburg) has been closed since 2020 due to a legal dispute — do not plan around it. White\'s Ford (Option B1) is the correct wade crossing if you want to ford the river.'}
   ],
   bikeNote:'The W&OD follows the original railroad bed that Stonewall Jackson\'s cavalry raided in October 1861, tearing up track near Vienna. Riding it west toward the Blue Ridge puts you on contested ground from the earliest weeks of the war.',
   warn:'Check current MARC Brunswick westbound schedule at mta.maryland.gov before departure — limited afternoon trains run westbound from Point of Rocks on weekdays.'},

  {id:'harpers-ferry-town', name:'Harpers Ferry Historic Town', mode:'bike',
   arrive:'~5:30–6:30pm', depart:null, duration:'Evening',
   coords:[39.3239,-77.7296],
   eyebrow:'Day 6 · Evening · On foot and bicycle',
   body:'Harpers Ferry sits at the dramatic confluence of the Potomac and Shenandoah Rivers. John Brown\'s 1859 raid on the Federal Armory here was a direct prologue to the war Branch fought. In September 1862, while Ramsay was at South Mountain with Lee\'s main army, Branch\'s brigade was part of Stonewall Jackson\'s force that captured Harpers Ferry on September 15 — nearly 13,000 Union prisoners, the largest surrender of Union forces in the war.',

{id:7, label:'Day 7', title:'Antietam', events:[
  {id:'co-canal-ride', name:'Route Option A — C&O Canal Towpath to Antietam', mode:'bike',
   arrive:null, depart:'~8:00am', duration:'~12 miles · 1.5–2 hours',
   coords:[39.4557,-77.7446],
   eyebrow:'Day 7 · Morning · Bicycle · C&O Canal Towpath · OPTION A',
   body:'Option A: Depart Harpers Ferry by 8am and ride the C&O Canal Towpath north along the Potomac — 12 flat, traffic-free miles of crushed limestone. This path traces the ground over which Lee\'s army crossed the Potomac in September 1862. Pass Boteler\'s Ford near Shepherdstown, where Confederate stragglers crossed under Union fire on September 19. Exit the towpath at the Burnside Bridge Road area to reach Antietam. See Option B below for the more historically immersive — and adventurous — alternative.',
   logistics:[
     {icon:'🚲',text:'Start at the Harpers Ferry railroad bridge crossing. Follow towpath north ~12 miles to Lock 38 / Antietam Creek Aqueduct area. Flat crushed limestone — suitable for hybrid or gravel bike.'},
     {icon:'📍',text:'Exit towpath at Burnside Bridge Rd and follow signs east to Antietam National Battlefield Visitor Center.'},
     {icon:'⏱️',text:'Allow 1.5–2 hours riding, plus optional stop at Shepherdstown (~8 miles) where Lee\'s wounded flooded after the battle.'}
   ],
   bikeNote:'At Boteler\'s Ford near Shepherdstown, you cross the retreat corridor of Lee\'s Army of Northern Virginia.',
   warn:null},

  {id:'ap-hill-march', name:'Route Option B — A.P. Hill\'s March to Antietam', mode:'bike',
   arrive:null, depart:'~7:30am', duration:'~17 miles · 3–4 hours · includes river ford',
   coords:[39.3850,-77.7600],
   eyebrow:'Day 7 · Morning · Bicycle · A.P. Hill\'s Route · OPTION B · Adventure Route',
   body:'On September 17, 1862, A.P. Hill\'s Light Division departed Harpers Ferry at 7:30am and covered 17 miles in roughly seven hours to arrive at Antietam just in time to shatter Burnside\'s assault on the Confederate right — saving Lee\'s army. Branch\'s brigade marched second in the column, behind Gregg and ahead of Archer. Hill took the Harpers Ferry Road north, roughly parallel to the Potomac, before crossing at Blackford\'s Ford (also known as Boteler\'s Ford) into Maryland and pressing on to the battlefield. When Hill reported to Lee, the general reportedly exclaimed "General Hill, I was never so glad to see you." Branch was dead within hours of arriving. Riding this route means fording the Potomac — shallow at Boteler\'s Ford in summer conditions but a genuine crossing. Check water levels before attempting. The American Battlefield Trust and NPS Antietam have published maps of Hill\'s route.',
   logistics:[
     {icon:'🚲',text:'Depart Harpers Ferry 7:30am following Harpers Ferry Road (WV Rt 340 / Halltown area) north along the Potomac. The route runs roughly parallel to the river for several miles before turning toward Boteler\'s Ford.'},
     {icon:'🌊',text:'Boteler\'s Ford (Blackford\'s Ford): the Potomac crossing point, approximately 1 mile north of Shepherdstown. In summer/fall low-water conditions typically knee-to-thigh deep — fordable on foot with bike in hand. Check current USGS Potomac water levels before attempting: waterdata.usgs.gov.'},
     {icon:'📍',text:'After crossing, follow Trego Road / Harpers Ferry Road north into Sharpsburg. The route enters the battlefield from the south via what is now Harpers Ferry Road — the same road Branch\'s brigade used to reach the Confederate right flank.'},
     {icon:'🏛️',text:'NPS Antietam Visitor Center has a hand-drawn map of Hill\'s route available at the front desk. The battlefield\'s Harpers Ferry Road tour stop marks where Branch\'s, Gregg\'s, and Archer\'s brigades formed their attack line.'},
     {icon:'⚠️',text:'Total distance: ~17 miles. Allow 3–4 hours including the ford crossing. Bring water shoes or sandals for the crossing, dry bags for gear, and check river conditions the evening before.'}
   ],
   bikeNote:'Branch Avenue on the Antietam battlefield is named for LOB Branch. It marks the ground his brigade crossed in their final attack — arriving at the end of a 17-mile march, within hours of his death.',
   warn:'Fording the Potomac requires advance planning. Check USGS water gauge at Shepherdstown (station 01617800) — safe fording typically requires a gauge reading under 4.5 feet. Do not attempt in high water. This is an adventure route, not a casual ride.'},

  {id:'antietam-battlefield', name:'Antietam National Battlefield', mode:'battle',
   arrive:'~10:00am', depart:null, duration:'3–4 hours',
   coords:[39.4757,-77.7446],
   eyebrow:'Day 7 · Mid-Morning · Bicycle tour of battlefield',
   body:'September 17, 1862. Branch\'s brigade held the Confederate left along the Hagerstown Turnpike in the bloodiest single day in American military history — 23,000 casualties. Branch was killed here in the late afternoon by a sharpshooter\'s bullet, hours before the fighting ended. Ramsay\'s battery was positioned nearby. It was here, on this field, that Ramsay looked through his spyglass — the spyglass now in your family — and described troop positions to Robert E. Lee, whose injured hands prevented him from using it himself. The 8.5-mile battlefield auto tour route translates perfectly to a self-guided bike tour.',
   logistics:[
     {icon:'🏛️',text:'Antietam National Battlefield Visitor Center: 5831 Dunker Church Rd, Sharpsburg MD 21782. Open daily. Film and museum inside.'},
     {icon:'🚲',text:'The 8.5-mile battlefield tour route is one of the finest cycling routes in the mid-Atlantic — low traffic, rolling farmland, extraordinary views.'},
     {icon:'📍',text:'LOB Branch fell near the North Woods / Dunker Church area. A marker identifies the spot. Stand there.'},
     {icon:'🚗',text:'For a full interpretation: NPS can recommend licensed battlefield guides. Consider booking in advance for a 2-hour guided tour.'}
   ],
   bikeNote:'The Cornfield, Sunken Road (Bloody Lane), and Burnside Bridge are all accessible on the bike tour route. Allow 3–4 hours minimum to ride and reflect.',
   warn:null},

  {id:'shepherdstown-lodge', name:'Overnight — Jacob Rohrbach Inn, Sharpsburg', mode:'lodge',
   arrive:'~2–3pm', depart:null, duration:'Overnight',
   coords:[39.4472,-77.7399],
   eyebrow:'Day 7 · Afternoon/Evening · Overnight at the battlefield',
   body:'The Jacob Rohrbach Inn is the ideal place to end this tour. The 1804 Federal-style brick house stands on West Main Street in Sharpsburg — less than a mile from the battlefield — and is named for the man who owned the farm at the creek crossing now known as Burnside Bridge. Rohrbach\'s bridge, Rohrbach\'s farm, Rohrbach\'s house: you sleep inside the battle\'s geography. Innkeepers Chris and Amy Vincent are deeply knowledgeable about Antietam, and the inn provides bicycles for guests to ride the battlefield and the C&O Canal, just 1.25 miles away. Country breakfast served at 8:30am; coffee available from 7am.',
   logistics:[
     {icon:'🏨',text:'Jacob Rohrbach Inn: 138 W Main St, Sharpsburg MD 21782. Phone: (301) 432-5079. Email: info@jacob-rohrbach-inn.com. Web: jacob-rohrbach-inn.com. Five rooms, all private baths. Book well ahead — fills quickly around Antietam events.'},
     {icon:'🚲',text:'Inn provides bicycles for guests — ideal for an early-morning ride to the battlefield before crowds arrive, or a run down to the C&O Canal towpath (1.25 miles).'},
     {icon:'🍳',text:'Breakfast at 8:30am daily: country-style, locally sourced, from the inn\'s own gardens. Coffee from 7am.'},
     {icon:'🏨',text:'Alternative lodging: Bavarian Inn (164 Shepherd Grade Rd, Shepherdstown WV) or Thomas Shepherd Inn (300 W German St, Shepherdstown) — both across the Potomac, ~4 miles from battlefield.'},
     {icon:'🚂',text:'Return to DC: Amtrak Capitol Limited departs Harpers Ferry ~11:30am daily, arrives Union Station ~1pm. MARC Brunswick Line eastbound weekday mornings (multiple departures 5am–7am from Harpers Ferry).'}
   ],
   bikeNote:'Borrow an inn bicycle for a dawn ride to the battlefield — the ground looks different in the early light, before the tour buses arrive. Burnside Bridge is a 10-minute ride from the inn\'s front door.',
   warn:null},
]},
];

  {coords:[[37.5381,-77.4525],[37.5540,-77.4593]], mode:'bike'},
  {coords:[[37.5333,-77.4284],[38.0293,-78.4767]], mode:'bus'},
  {coords:[[38.0293,-78.4767],[38.4722,-77.9933]], mode:'train'},
  {coords:[[38.4722,-77.9933],[38.2458,-78.1130]], mode:'bus'},
  {coords:[[38.2458,-78.1130],[38.1381,-78.1840]], mode:'tour'},
  {coords:[[38.2458,-78.1130],[38.4722,-77.9933]], mode:'bus'},
  {coords:[[38.4722,-77.9933],[38.7510,-77.4760]], mode:'train'},
  // Option B: Jackson flank march bike route Culpeper→Brandy Station→Waterloo→Marshall→Thoroughfare Gap→Manassas
  {coords:[[38.4722,-77.9933],[38.5080,-77.8960],[38.5850,-77.9650],[38.6580,-77.9750],[38.7210,-77.9200],[38.7580,-77.8200],[38.7510,-77.4760]], mode:'bike'},
  {coords:[[38.7510,-77.4760],[38.8133,-77.5244]], mode:'tour'},
  {coords:[[38.8133,-77.5244],[38.7240,-77.5430]], mode:'tour'},
  {coords:[[38.7510,-77.4760],[38.8974,-77.0066]], mode:'train'},
  // Option B1: W&OD west to Leesburg, north to White's Ford, C&O towpath to Point of Rocks
  {coords:[[38.7510,-77.4760],[38.9410,-77.3960],[39.0850,-77.5680],[39.1147,-77.5430],[39.2735,-77.5333]], mode:'bike'},
  // Option B2: W&OD all the way to Purcellville, then north to Point of Rocks via bridge
  {coords:[[38.9410,-77.3960],[39.1360,-77.7160],[39.2735,-77.5333]], mode:'bike'},
  {coords:[[38.8974,-77.0066],[39.3244,-77.7311]], mode:'train'},
  // Option B: MARC Brunswick from Point of Rocks to Harpers Ferry
  {coords:[[39.2735,-77.5333],[39.3244,-77.7311]], mode:'train'},
  {coords:[[39.3244,-77.7311],[39.3239,-77.7296]], mode:'bike'},
  {coords:[[39.3239,-77.7296],[39.4557,-77.7446]], mode:'bike'},
  {coords:[[39.4557,-77.7446],[39.4757,-77.7446]], mode:'bike'},
  {coords:[[39.4757,-77.7446],[39.4472,-77.7399]], mode:'bike'},
];

// ─── MAP ────────────────────────────────────────────────────────────────────────
const map = L.map('map',{center:[38.5,-77.8],zoom:7,zoomControl:true});
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{
  attribution:'© OpenStreetMap contributors, © CARTO',maxZoom:18,subdomains:'abcd'
}).addTo(map);

ROUTES.forEach(r=>{
  L.polyline(r.coords,{
    color:C[r.mode]||'#888',weight:r.mode==='bike'?3:2.5,opacity:.65,
    dashArray:r.mode==='tour'?'6 4':null
  }).addTo(map);
});

// Build marker index
const allEvents = DAYS.flatMap(d=>d.events);
const markers = {};
allEvents.forEach(ev=>{
  const color=C[ev.mode]||'#888', emoji=E[ev.mode]||'•';
  const icon=L.divIcon({className:'',
    html:`<div style="width:26px;height:26px;border-radius:50%;background:${color};border:2px solid rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;font-size:11px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.5);">${emoji}</div>`,
    iconSize:[26,26],iconAnchor:[13,13]});
  const m=L.marker(ev.coords,{icon}).addTo(map);
  m.bindPopup(`<div class="pop-title">${ev.name}</div><div class="pop-meta">${ev.eyebrow}</div>${ev.depart?`<div class="pop-time">Dep: ${ev.depart}</div>`:''}${ev.arrive&&!ev.depart?`<div class="pop-time">Arr: ${ev.arrive}</div>`:''}`,{maxWidth:260});
  m.on('click',()=>selectEvent(ev.id));
  markers[ev.id]=m;
});

// ─── UI STATE ────────────────────────────────────────────────────────────────────
let activeDay=1, activeId=null;

function buildTabs(){
  const c=document.getElementById('dayTabs');
  DAYS.forEach(d=>{
    const b=document.createElement('button');
    b.className='dtab'+(d.id===activeDay?' active':'');
    b.textContent=`${d.label}`;
    b.title=d.title;
    b.addEventListener('click',()=>{
      activeDay=d.id;
      document.querySelectorAll('.dtab').forEach(t=>t.classList.remove('active'));
      b.classList.add('active');
      buildTimeline();
      const first=d.events[0];
      if(first) map.panTo(first.coords,{animate:true,duration:.6});
    });
    c.appendChild(b);
  });
}

function buildTimeline(){
  const c=document.getElementById('timeline');
  c.innerHTML='';
  const day=DAYS.find(d=>d.id===activeDay);
  if(!day) return;

  day.events.forEach((ev,i)=>{
    const color=C[ev.mode]||'#888', emoji=E[ev.mode]||'•';
    const isActive=ev.id===activeId;

    // TIME + DOT column wrapper
    const row=document.createElement('div');
    row.className='t-event'+(isActive?' active':'');
    row.dataset.id=ev.id;

    // Timing display
    let timeHTML='';
    if(ev.depart && ev.arrive){
      timeHTML=`<div class="arr" style="font-size:.58rem">arr ${ev.arrive}</div><div class="dep">${ev.depart}</div>`;
    } else if(ev.depart){
      timeHTML=`<div class="dep">${ev.depart}</div>`;
    } else if(ev.arrive){
      timeHTML=`<div class="dep" style="color:var(--muted)">${ev.arrive}</div>`;
    }

    row.innerHTML=`
      <div class="t-left">
        <div class="t-time">${timeHTML}</div>
        <div class="t-dot" style="border-color:${color};"></div>
        <div class="t-vline" style="background:${color}44;display:${i<day.events.length-1?'block':'none'}"></div>
      </div>
      <div class="t-card" style="${isActive?'border-left-color:var(--gold)':''}">
        <div class="t-label" style="color:${color}">${emoji} ${ev.mode.toUpperCase()}${ev.duration?` · ${ev.duration}`:''}</div>
        <div class="t-name">${ev.name}</div>
        ${ev.warn?`<div style="font-size:.62rem;color:#c8a030;margin-top:2px;">⚠️ Weekday constraint</div>`:''}
      </div>`;

    row.addEventListener('click',()=>selectEvent(ev.id));
    c.appendChild(row);
  });
}

function selectEvent(id){
  activeId=id;
  document.querySelectorAll('.t-event').forEach(el=>el.classList.toggle('active',el.dataset.id===id));
  document.querySelectorAll('.t-event .t-card').forEach(el=>{
    el.style.borderLeftColor = el.closest('.t-event').dataset.id===id ? 'var(--gold)' : 'transparent';
  });
  const ev=allEvents.find(e=>e.id===id);
  if(!ev) return;
  map.panTo(ev.coords,{animate:true,duration:.5});
  markers[id]?.openPopup();
  showDetail(ev);
}

function showDetail(ev){
  const panel=document.getElementById('detail');
  const color=C[ev.mode]||'#888', emoji=E[ev.mode]||'•';

  // Timing chips
  let timingHTML='';
  if(ev.depart) timingHTML+=`<div class="d-chip" style="color:${color};border-color:${color}44;background:${color}18;">🕐 Dep: ${ev.depart}</div>`;
  if(ev.arrive && !ev.depart) timingHTML+=`<div class="d-chip" style="color:var(--muted);border-color:#444;background:rgba(255,255,255,.04);">📍 Arr: ${ev.arrive}</div>`;
  if(ev.duration) timingHTML+=`<div class="d-chip" style="color:var(--muted);border-color:#444;background:rgba(255,255,255,.04);">⏱ ${ev.duration}</div>`;

  const logHTML = (ev.logistics||[]).map(l=>`<div class="d-row"><span class="d-icon">${l.icon}</span><span>${l.text}</span></div>`).join('');
  const bikeHTML = ev.bikeNote ? `<div class="d-bike">🚲 ${ev.bikeNote}</div>` : '';
  const warnHTML = ev.warn ? `<div class="d-warn">${ev.warn}</div>` : '';

  panel.innerHTML=`
    <button class="d-close" onclick="document.getElementById('detail').classList.add('hidden')">✕</button>
    <div class="d-eye">${ev.eyebrow}</div>
    <div class="d-title">${ev.name}</div>
    <div class="d-timing">
      <div class="d-chip" style="color:${color};border-color:${color}55;background:${color}18;">${emoji} ${ev.mode.charAt(0).toUpperCase()+ev.mode.slice(1)}</div>
      ${timingHTML}
    </div>
    <div class="d-body">${ev.body}</div>
    ${logHTML||warnHTML||bikeHTML ? `<div class="d-box"><div class="d-box-title">Logistics &amp; Timing</div>${logHTML}</div>` : ''}
    ${warnHTML}${bikeHTML}`;
  panel.classList.remove('hidden');
}

// ─── INIT ────────────────────────────────────────────────────────────────────────
buildTabs();
buildTimeline();
if(allEvents.length) selectEvent(allEvents[0].id);
</script>
