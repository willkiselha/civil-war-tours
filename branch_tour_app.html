<html lang="en">

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --lob: #8B0000;
    --bg: #0e0c08;
    --surface: #1a1710;
    --border: #3a3020;
    --gold: #c8a96e;
    --text: #e8d9b8;
    --muted: #9a8a6a;
  }

  body {
    font-family: 'EB Garamond', Georgia, serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* HEADER */
  header {
    padding: 8px 16px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-shrink: 0;
    z-index: 1000;
  }

  .title-block h1 {
    font-family: 'Playfair Display', serif;
    font-size: 1.05rem;
    font-style: italic;
    color: var(--gold);
    line-height: 1.1;
  }
  .title-block p {
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
    margin-top: 1px;
  }

  .legend {
    display: flex;
    gap: 14px;
    align-items: center;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 0.7rem;
    color: var(--muted);
    letter-spacing: 0.05em;
  }
  .legend-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  /* DAY FILTER */
  .day-filter {
    display: flex;
    gap: 4px;
    align-items: center;
  }
  .day-filter label {
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin-right: 4px;
  }
  .day-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: 'EB Garamond', serif;
    font-size: 0.7rem;
    padding: 3px 8px;
    cursor: pointer;
    border-radius: 2px;
    transition: all 0.2s;
    letter-spacing: 0.05em;
  }
  .day-btn.active, .day-btn:hover {
    background: var(--border);
    color: var(--gold);
    border-color: var(--gold);
  }

  /* MAIN LAYOUT */
  .main {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* SIDEBAR */
  .sidebar {
    width: 320px;
    flex-shrink: 0;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .sidebar-list {
    overflow-y: auto;
    flex: 1;
    padding: 8px 0;
  }
  .sidebar-list::-webkit-scrollbar { width: 4px; }
  .sidebar-list::-webkit-scrollbar-track { background: var(--bg); }
  .sidebar-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .stop-item {
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    transition: background 0.15s;
    display: flex;
    gap: 10px;
    align-items: flex-start;
  }
  .stop-item:hover { background: rgba(200,169,110,0.05); }
  .stop-item.active { background: rgba(200,169,110,0.1); border-left: 3px solid var(--gold); }

  .stop-day-badge {
    font-size: 0.6rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    white-space: nowrap;
    padding-top: 2px;
    min-width: 30px;
  }

  .stop-info { flex: 1; min-width: 0; }
  .stop-name {
    font-size: 0.85rem;
    color: var(--text);
    line-height: 1.3;
    font-weight: 500;
  }
  .stop-location {
    font-size: 0.7rem;
    color: var(--muted);
    margin-top: 2px;
    font-style: italic;
  }
  .stop-date {
    font-size: 0.65rem;
    color: var(--muted);
    margin-top: 2px;
    letter-spacing: 0.04em;
  }

  .char-pip {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    margin-top: 5px;
    flex-shrink: 0;
  }

  /* MAP */
  #map { flex: 1; }

  /* POPUP PANEL */
  .popup-panel {
    position: absolute;
    bottom: 20px;
    right: 20px;
    width: 340px;
    max-height: 60vh;
    background: rgba(14,12,8,0.96);
    border: 1px solid var(--border);
    border-radius: 3px;
    z-index: 900;
    display: none;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 4px 24px rgba(0,0,0,0.6);
  }
  .popup-panel.visible { display: flex; }

  .popup-header {
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;

  .popup-header-text { flex: 1; }
  .popup-day {
    font-size: 0.6rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
  }
  .popup-name {
    font-family: 'Playfair Display', serif;
    font-size: 1rem;
    color: var(--gold);
    line-height: 1.2;
    margin-top: 2px;
  }
  .popup-location {
    font-size: 0.72rem;
    color: var(--muted);
    font-style: italic;
    margin-top: 2px;
  }
  .popup-date-hist {
    font-size: 0.68rem;
    color: var(--muted);
    margin-top: 3px;
    letter-spacing: 0.04em;
  }

  .popup-close {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 1.2rem;
    cursor: pointer;
    padding: 0 4px;
    line-height: 1;
    flex-shrink: 0;
  }
  .popup-close:hover { color: var(--text); }

  .popup-body {
    overflow-y: auto;
    flex: 1;
    padding: 12px 14px;
  }
  .popup-body::-webkit-scrollbar { width: 3px; }
  .popup-body::-webkit-scrollbar-thumb { background: var(--border); }

  .narrative-section {
    margin-bottom: 12px;
  }
  .narrative-label {
    font-size: 0.6rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--muted);
    margin-bottom: 5px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .narrative-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }
  .narrative-text {
    font-size: 0.82rem;
    line-height: 1.65;
    color: var(--text);
  }
  .narrative-text.fiction {
    font-style: italic;
    color: #c8b890;
  }

  .visitor-box {
    background: rgba(200,169,110,0.06);
    border: 1px solid rgba(200,169,110,0.2);
    border-radius: 2px;
    padding: 8px 10px;
    margin-top: 8px;
  }
  .visitor-label {
    font-size: 0.6rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--gold);
    margin-bottom: 4px;
  }
  .visitor-text {
    font-size: 0.78rem;
    color: var(--muted);
    line-height: 1.5;
  }

  /* LEAFLET OVERRIDES */
  .leaflet-control-attribution {
    background: rgba(14,12,8,0.85) !important;
    color: var(--muted) !important;
    font-size: 0.6rem !important;
  }
  .leaflet-control-attribution a { color: var(--gold) !important; }
  .leaflet-control-zoom a {
    background: var(--surface) !important;
    color: var(--gold) !important;
    border-color: var(--border) !important;
  }
  .leaflet-control-zoom a:hover { background: var(--border) !important; }

  /* CUSTOM MARKERS */
  .marker-pin {
    width: 26px;
    height: 26px;
    border-radius: 50% 50% 50% 0;
    transform: rotate(-45deg);
    border: 2px solid rgba(255,255,255,0.3);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .marker-pin span {
    transform: rotate(45deg);
    font-size: 0.55rem;
    font-weight: bold;
    color: white;
    font-family: 'EB Garamond', serif;
  }

  @media (max-width: 700px) {
    .sidebar { display: none; }
    .popup-panel { width: calc(100vw - 24px); right: 12px; }
    .legend { display: none; }
  }
</style>
</head>

// ── COLORS ──────────────────────────────────────────────────
const charColor = { LOB:'#8B0000' };
const charLabel = { LOB:'Branch' };

// ── MARKERS ─────────────────────────────────────────────────
let markers = [];
let activeStop = null;

function makeIcon(stop) {
  const color = charColor[stop.character] || '#555';
  const isFinal = stop.category === 'battlefield_final';
  const html = `
    <div style="
      width:${isFinal?32:24}px;
      height:${isFinal?32:24}px;
      background:${color};
      border-radius:50% 50% 50% 0;
      transform:rotate(-45deg);
      border:2px solid rgba(255,255,255,${isFinal?0.8:0.4});
      display:flex;align-items:center;justify-content:center;
      box-shadow:0 2px 6px rgba(0,0,0,0.5);
    ">
      <span style="transform:rotate(45deg);color:white;font-size:${isFinal?10:8}px;font-weight:bold;font-family:serif;">
        ${stop.day}
      </span>
    </div>`;
  return L.divIcon({ html, className:'', iconSize:[isFinal?32:24,isFinal?32:24], iconAnchor:[isFinal?16:12,isFinal?32:24] });
}

function buildMarkers(dayFilter) {
  markers.forEach(m => map.removeLayer(m.marker));
  markers = [];

  const filtered = dayFilter === 0 ? stops : stops.filter(s => s.day === dayFilter);

  filtered.forEach(stop => {
    const m = L.marker([stop.coords[1], stop.coords[0]], { icon: makeIcon(stop) });
    m.addTo(map);
    m.on('click', () => showStop(stop));
    markers.push({ stop, marker: m });
  });

  // Draw route line
  if (window.routeLine) map.removeLayer(window.routeLine);
  if (filtered.length > 1) {
    const latlngs = filtered.map(s => [s.coords[1], s.coords[0]]);
    window.routeLine = L.polyline(latlngs, {
      color: '#c8a96e',
      weight: 3,
      opacity: 0.85
    }).addTo(map);
    window.routeLine.bringToFront();
  }
}

function showStop(stop) {
  activeStop = stop.id;

  // Update sidebar active
  document.querySelectorAll('.stop-item').forEach(el => {
    el.classList.toggle('active', el.dataset.id === stop.id);
  });

  // Pan map
  map.panTo([stop.coords[1], stop.coords[0]]);

  // Fill popup
  document.getElementById('popup-day').textContent = `Day ${stop.day} · Stop ${stop.order}`;
  document.getElementById('popup-name').textContent = stop.name;
  document.getElementById('popup-location').textContent = stop.location;
  document.getElementById('popup-date').textContent = stop.date_historical;

  let body = '';

  if (stop.narrative_documented) {
    body += `<div class="narrative-section">
      <div class="narrative-label">Historical Record</div>
      <div class="narrative-text">${stop.narrative_documented}</div>
    </div>`;
  }

  if (stop.narrative_fiction) {
    body += `<div class="narrative-section">
      <div class="narrative-label">Narrative</div>
      <div class="narrative-text fiction">${stop.narrative_fiction}</div>
    </div>`;
  }

  if (stop.visitor_info) {
    body += `<div class="visitor-box">
      <div class="visitor-label">▶ Visitor Notes</div>
      <div class="visitor-text">${stop.visitor_info}</div>
    </div>`;
  }

  document.getElementById('popup-body').innerHTML = body;
  document.getElementById('popup-panel').classList.add('visible');
}

function closePopup() {
  document.getElementById('popup-panel').classList.remove('visible');
  activeStop = null;
  document.querySelectorAll('.stop-item').forEach(el => el.classList.remove('active'));
}

// ── SIDEBAR ─────────────────────────────────────────────────
function buildSidebar(dayFilter) {
  const list = document.getElementById('sidebar-list');
  const filtered = dayFilter === 0 ? stops : stops.filter(s => s.day === dayFilter);
  let html = '';
  let currentDay = null;

  filtered.forEach(stop => {
    if (stop.day !== currentDay) {
      currentDay = stop.day;
      html += `<div style="padding:6px 14px 4px;font-size:0.6rem;text-transform:uppercase;letter-spacing:0.12em;color:var(--gold);border-top:1px solid var(--border);margin-top:${currentDay===1?0:4}px;">Day ${currentDay}</div>`;
    }
    const color = charColor[stop.character] || '#555';
    html += `
      <div class="stop-item" data-id="${stop.id}" onclick="sidebarClick('${stop.id}')">
        <div class="char-pip" style="background:${color}"></div>
        <div class="stop-info">
          <div class="stop-name">${stop.name}</div>
          <div class="stop-location">${stop.location}</div>
          <div class="stop-date">${stop.date_historical}</div>
        </div>
      </div>`;
  });

  list.innerHTML = html;
}

function sidebarClick(id) {
  const stop = stops.find(s => s.id === id);
  if (stop) showStop(stop);
}

// ── DAY FILTER ───────────────────────────────────────────────
let currentDay = 0;
function filterDay(day, btn) {
  currentDay = day;
  document.querySelectorAll('.day-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  buildMarkers(day);
  buildSidebar(day);
  closePopup();
  if (day === 0) {
    map.setView([38.95, -77.6], 8);
  } else {
    const dayStops = stops.filter(s => s.day === day);
    if (dayStops.length) {
      const lats = dayStops.map(s => s.coords[1]);
      const lngs = dayStops.map(s => s.coords[0]);
      map.fitBounds([[Math.min(...lats)-0.1, Math.min(...lngs)-0.1],[Math.max(...lats)+0.1, Math.max(...lngs)+0.1]]);
    }
  }
}

// ── INIT ─────────────────────────────────────────────────────
buildMarkers(0);
buildSidebar(0);
</script>
</body>
</html>
